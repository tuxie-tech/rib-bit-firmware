; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ATmega328PB]
platform = atmelavr
board = ATmega328PB
framework = arduino

; --- Disable Auto Upload Port Detection ---
; This prevents PlatformIO from trying to auto-detect the upload port to allow upload via AVR Dragon
board_upload.require_upload_port = false

; --- Fuse Settings for 16MHz External Crystal ---
;board_fuses.lfuse = 0xFF
board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xD7
board_fuses.efuse = 0xF7

; --- Clock Frequency to 16Mhz ---
;board_build.f_cpu = 16000000L
board_build.f_cpu = 8000000L

upload_protocol = dragon_isp
upload_flags =
    -v
    -B 20